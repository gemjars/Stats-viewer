<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Stats Viewer</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="app-header">
  <h1>Tournament Stats Viewer</h1>
  <div class="storage-controls">
    <span id="storage-status" class="storage-status">Using browser storage</span>
    <button id="btn-connect-folder" class="btn btn-secondary" hidden title="Choose an empty folder on your computer to save a players-data.json file to. Don't pick this app's own folder.">Connect Folder</button>
    <button id="btn-export" class="btn btn-secondary">Export JSON</button>
    <button id="btn-import" class="btn btn-secondary">Import JSON</button>
    <input type="file" id="input-import" accept="application/json" hidden>
  </div>
</header>
<p id="storage-help" class="storage-help"></p>

<nav class="tabs">
  <button class="tab-btn active" data-tab="players">Players</button>
  <button class="tab-btn" data-tab="compare">Compare</button>
</nav>

<main>
  <section id="tab-players" class="tab-panel active">
    <div class="toolbar">
      <button id="btn-add-player" class="btn btn-primary">+ Add Player</button>
    </div>
    <div id="players-grid" class="players-grid"></div>
    <p id="players-empty" class="empty-state" hidden>No players yet. Add your first player to get started.</p>
  </section>

  <section id="tab-compare" class="tab-panel">
    <div class="compare-picker-wrap">
      <div class="compare-picker-header">
        <h3>Select players to compare</h3>
        <div class="compare-picker-actions">
          <button id="btn-select-all" class="btn btn-secondary btn-small">Select All</button>
          <button id="btn-select-none" class="btn btn-secondary btn-small">Clear</button>
        </div>
      </div>
      <div id="compare-picker" class="compare-picker"></div>
    </div>
    <p id="compare-empty" class="empty-state">Select a player to see their stats.</p>
    <div id="compare-charts-wrap" class="compare-charts-wrap"></div>
    <details id="compare-details" class="compare-details">
      <summary>Show detailed stats table &amp; match history</summary>
      <div id="compare-table-wrap" class="compare-table-wrap"></div>
      <div id="compare-matches-wrap" class="compare-matches-wrap"></div>
    </details>
  </section>
</main>

<!-- Player Form Modal -->
<div id="player-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="player-modal-title">Add Player</h2>
      <button type="button" id="btn-close-modal" class="btn-icon" aria-label="Close">&times;</button>
    </div>
    <form id="player-form" class="modal-body">
      <div class="form-section">
        <h3>Basic Info</h3>
        <label>Name
          <input type="text" id="f-name" required>
        </label>
        <label>Pronouns
          <input type="text" id="f-pronouns" placeholder="e.g. she/her">
        </label>
        <label>Country
          <input type="text" id="f-country" placeholder="e.g. Canada">
        </label>
        <label>Name Pronounced
          <input type="text" id="f-pronounced" placeholder="e.g. Zuh-KY-ree">
        </label>
        <label>Key Facts
          <textarea id="f-keyfacts" rows="3" placeholder="One fact per line"></textarea>
        </label>
      </div>

      <div class="form-section">
        <h3>Stats from Champs 1</h3>
        <label class="checkbox-label">
          <input type="checkbox" id="f-champs1-dnp">
          Did not play in Champs 1
        </label>
        <div id="champs1-content">
          <label>Placement
            <input type="text" id="f-champs1-placement" placeholder="e.g. 3rd place">
          </label>
          <div id="champs1-modes" class="modes-grid"></div>
          <h4>Match History</h4>
          <div id="champs1-matches" class="matches-list"></div>
          <button type="button" id="btn-add-match" class="btn btn-secondary btn-small">+ Add Match</button>
        </div>
      </div>

      <div class="form-section">
        <h3>Stats from Qualifying</h3>
        <label>Elo
          <input type="text" id="f-qualifying-elo" placeholder="e.g. 1450">
        </label>
        <label>Placement
          <input type="text" id="f-qualifying-placement" placeholder="e.g. 5th place">
        </label>
        <div id="qualifying-modes" class="modes-grid"></div>
      </div>
    </form>
    <div class="modal-footer">
      <button type="button" id="btn-cancel-player" class="btn btn-secondary">Cancel</button>
      <button type="submit" form="player-form" class="btn btn-primary">Save Player</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/constants.js"></script>
<script src="js/storage.js"></script>
<script src="js/players-ui.js"></script>
<script src="js/compare-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
